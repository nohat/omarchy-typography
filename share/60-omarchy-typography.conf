<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  omarchy-typography: last-resort icon fallback.
  Appends the symbols-only Nerd Font to the END of every family list, so it is
  consulted only for glyphs no other font provides (Nerd Font private-use icons).
  It contains no letters or digits, so it can never change text rendering.
  This file does not touch the `monospace` alias; `omarchy font set` owns that
  through ~/.config/fontconfig/fonts.conf.
-->
<fontconfig>
  <match target="pattern">
    <edit name="family" mode="append_last" binding="weak">
      <string>Symbols Nerd Font</string>
    </edit>
  </match>
</fontconfig>
